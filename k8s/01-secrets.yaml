# NOTE: These are sample base64-encoded values for demo purposes only.
# In real deployments, generate secrets with:
#   kubectl create secret generic foodie-secrets \
#     --from-literal=MONGO_USERNAME=<user> \
#     --from-literal=MONGO_PASSWORD=<pass> \
#     --from-literal=JWT_SECRET=<secret> -n foodie
# or better, use a secrets manager (Sealed Secrets, Vault, External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: foodie-secrets
  namespace: foodie
type: Opaque
data:
  MONGO_USERNAME: bW9uZ28tdXNlcg==       # mongo-user
  MONGO_PASSWORD: bW9uZ28tcGFzcw==       # mongo-pass
  JWT_SECRET: c3VwZXJzZWNyZXRqd3RrZXk=   # supersecretjwtkey
  # Full connection string the backend uses directly (kept in sync with the two values above)
  MONGO_URI: bW9uZ29kYjovL21vbmdvLXVzZXI6bW9uZ28tcGFzc0Btb25nby1zZXJ2aWNlOjI3MDE3L2Zvb2RpZT9hdXRoU291cmNlPWFkbWlu

